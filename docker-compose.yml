services:
  deepseek-ocr-api:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: deepseek-ocr-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - model_cache:/root/.cache/huggingface
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - HF_HOME=/root/.cache/huggingface
      - MODEL_NAME=${MODEL_NAME:-deepseek-ai/DeepSeek-OCR-2}
      - BASE_SIZE=${BASE_SIZE:-1024}
      - IMAGE_SIZE=${IMAGE_SIZE:-768}
      - OCR_FAKE_MODE=${OCR_FAKE_MODE:-0}
      - OCR_FAKE_RESULT=${OCR_FAKE_RESULT:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  deepseek-ocr-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepseek-ocr-web
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - deepseek-ocr-api
    environment:
      - API_URL=http://deepseek-ocr-api:8000
    restart: unless-stopped

volumes:
  model_cache:
    driver: local
